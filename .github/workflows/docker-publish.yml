name: Docker Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v0.1.1, v0.1.1-staging)'
        required: true
        type: string
      environment:
        description: 'Environment'
        required: true
        type: choice
        options:
          - staging
          - production
        default: staging

# Images are published as ghcr.io/openctemio/sensor (RFC-023 §9.5).
#
# The pre-rename images ghcr.io/openctemio/agent:* are FROZEN: this workflow
# never pushes to them again, and they must not be deleted or overwritten, so
# a pipeline pinned to an old tag keeps pulling exactly what it pulled
# before. (No new image is pushed under the old name either: a re-push would
# overwrite a tag a customer pinned.)
#
# Every published image is signed with cosign, keyless (Sigstore): the
# signature's certificate names this workflow at a v* tag of
# openctemio/sensor, issued from GitHub's OIDC token. Verify with:
#
#   cosign verify ghcr.io/openctemio/sensor:<tag> \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     --certificate-identity-regexp '^https://github\.com/openctemio/sensor/\.github/workflows/docker-publish\.yml@refs/tags/v'
#
# The managed-update flow (api RFC-031 §Phase 2) pulls sensor images by digest
# only after this verification, so only images built here can be installed.
env:
  # Primary registry (GHCR - always available via GITHUB_TOKEN)
  IMAGE_NAME: ghcr.io/openctemio/sensor
  # Secondary registry (Docker Hub - optional)
  DH_IMAGE_NAME: openctemio/sensor

permissions:
  contents: read

jobs:
  # ============================================
  # Prepare - Set build variables
  # ============================================
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.vars.outputs.VERSION }}
      environment: ${{ steps.vars.outputs.ENVIRONMENT }}
      latest_suffix: ${{ steps.vars.outputs.LATEST_SUFFIX }}
      has_dockerhub: ${{ steps.check.outputs.HAS_DOCKERHUB }}
    steps:
      - name: Check Docker Hub credentials
        id: check
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            echo "HAS_DOCKERHUB=true" >> $GITHUB_OUTPUT
            echo "::notice::Docker Hub credentials found - will mirror to Docker Hub"
          else
            echo "HAS_DOCKERHUB=false" >> $GITHUB_OUTPUT
            echo "::notice::No Docker Hub credentials - publishing to GHCR only"
          fi

      # The version and environment reach the shell through env, never through
      # ${{ }} interpolated into the script: an expression is pasted into the
      # script text before bash parses it, so a version like `v1.0.0";id;"`
      # would run as code. The version is then validated for BOTH triggers
      # (a pushed tag name can carry shell metacharacters too) and anchored
      # at both ends, because every later job interpolates the output.
      - name: Set build variables
        id: vars
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_ENVIRONMENT: ${{ github.event.inputs.environment }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
            ENVIRONMENT="$INPUT_ENVIRONMENT"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
            if [[ "$VERSION" == *"-staging"* ]]; then
              ENVIRONMENT="staging"
            else
              ENVIRONMENT="production"
            fi
          fi

          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid version format. Must match v<major>.<minor>.<patch>[-suffix] (e.g., v0.1.0, v1.0.0-staging)"
            exit 1
          fi
          if [[ "$ENVIRONMENT" != "staging" && "$ENVIRONMENT" != "production" ]]; then
            echo "::error::Invalid environment"
            exit 1
          fi

          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "ENVIRONMENT=$ENVIRONMENT" >> $GITHUB_OUTPUT

          if [ "$ENVIRONMENT" = "staging" ]; then
            echo "LATEST_SUFFIX=staging-latest" >> $GITHUB_OUTPUT
          else
            echo "LATEST_SUFFIX=latest" >> $GITHUB_OUTPUT
          fi

  # ============================================
  # Build - Multi-arch builds for each variant
  # ============================================
  build:
    name: Build ${{ matrix.variant }} (${{ matrix.arch }})
    needs: [prepare]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        variant: [default, semgrep, trivy, nuclei, betterleaks]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build the image locally first and smoke-test it (every bundled tool
      # runs and the sensor reports it available). Nothing is pushed if a
      # tool is broken; the push below reuses this build's cache.
      - name: Build for smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.variant == 'default' && 'Dockerfile' || format('Dockerfile.{0}', matrix.variant) }}
          platforms: ${{ matrix.platform }}
          load: true
          tags: sensor-smoke:${{ matrix.variant }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache-${{ matrix.variant }}-${{ matrix.arch }}
          provenance: false
          sbom: false

      - name: Smoke test
        run: scripts/image-smoke-test.sh "${{ matrix.variant }}" "sensor-smoke:${{ matrix.variant }}"

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.variant == 'default' && 'Dockerfile' || format('Dockerfile.{0}', matrix.variant) }}
          platforms: ${{ matrix.platform }}
          # Stamped into the binary (-X main.Version); without it every
          # published image reported "OpenCTEM Sensor version dev".
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache-${{ matrix.variant }}-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache-${{ matrix.variant }}-${{ matrix.arch }},mode=max
          provenance: false
          sbom: false

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.variant }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # ============================================
  # Merge - Create multi-platform manifests on GHCR
  # ============================================
  merge:
    name: Merge ${{ matrix.variant }}
    runs-on: ubuntu-latest
    needs: [prepare, build]
    permissions:
      contents: read
      packages: write
      # Keyless signing: cosign exchanges the job's OIDC token for a
      # short-lived Fulcio certificate naming this workflow.
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        variant: [default, semgrep, trivy, nuclei, betterleaks]
    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.variant }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Create manifest and push
        id: manifest
        working-directory: /tmp/digests
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          VARIANT="${{ matrix.variant }}"
          LATEST="${{ needs.prepare.outputs.latest_suffix }}"
          TAG_ARGS="-t ${{ env.IMAGE_NAME }}:${VERSION}-${VARIANT} -t ${{ env.IMAGE_NAME }}:${LATEST}-${VARIANT}"
          # The default image is also the plain tag (sensor:v0.4.2, sensor:latest);
          # the -default names stay for existing pulls.
          if [ "$VARIANT" = default ]; then
            TAG_ARGS="$TAG_ARGS -t ${{ env.IMAGE_NAME }}:${VERSION} -t ${{ env.IMAGE_NAME }}:${LATEST}"
          fi

          docker buildx imagetools create $TAG_ARGS \
            $(printf '${{ env.IMAGE_NAME }}@sha256:%s ' *)

          # The digest of the multi-platform index just pushed: what gets
          # signed and what a managed update pins.
          DIGEST="$(docker buildx imagetools inspect "${{ env.IMAGE_NAME }}:${VERSION}-${VARIANT}" --format '{{json .Manifest}}' | jq -r .digest)"
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::could not read the index digest of ${VERSION}-${VARIANT}: '$DIGEST'"
            exit 1
          fi
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Sign the image (cosign keyless)
        env:
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: |
          # --recursive signs the index and every per-platform manifest, so
          # a pull of either form verifies. Signed by digest, never by tag.
          cosign sign --yes --recursive "${{ env.IMAGE_NAME }}@${DIGEST}"

      - name: Verify the signature
        env:
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: |
          cosign verify "${{ env.IMAGE_NAME }}@${DIGEST}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/docker-publish.yml@${{ github.ref }}" \
            > /dev/null

      - name: Generate build summary
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          VARIANT="${{ matrix.variant }}"
          LATEST="${{ needs.prepare.outputs.latest_suffix }}"
          echo "### ${VARIANT}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ env.IMAGE_NAME }}@${{ steps.manifest.outputs.digest }} (signed)" >> $GITHUB_STEP_SUMMARY
          echo "${{ env.IMAGE_NAME }}:${VERSION}-${VARIANT}" >> $GITHUB_STEP_SUMMARY
          echo "${{ env.IMAGE_NAME }}:${LATEST}-${VARIANT}" >> $GITHUB_STEP_SUMMARY
          if [ "$VARIANT" = default ]; then
            echo "${{ env.IMAGE_NAME }}:${VERSION}" >> $GITHUB_STEP_SUMMARY
            echo "${{ env.IMAGE_NAME }}:${LATEST}" >> $GITHUB_STEP_SUMMARY
          fi
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  # ============================================
  # Mirror to Docker Hub (optional)
  # ============================================
  mirror-to-dockerhub:
    name: Mirror ${{ matrix.variant }} to Docker Hub
    runs-on: ubuntu-latest
    needs: [prepare, merge]
    if: needs.prepare.outputs.has_dockerhub == 'true'
    permissions:
      contents: read
      packages: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        variant: [default, semgrep, trivy, nuclei, betterleaks]
    steps:
      - name: Install crane
        uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b # v0.7

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Mirror to Docker Hub
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          VARIANT="${{ matrix.variant }}"
          LATEST="${{ needs.prepare.outputs.latest_suffix }}"

          echo "Copying ${{ env.IMAGE_NAME }}:${VERSION}-${VARIANT} -> ${{ env.DH_IMAGE_NAME }}:${VERSION}-${VARIANT}"
          crane copy "${{ env.IMAGE_NAME }}:${VERSION}-${VARIANT}" "${{ env.DH_IMAGE_NAME }}:${VERSION}-${VARIANT}"

          echo "Copying ${{ env.IMAGE_NAME }}:${LATEST}-${VARIANT} -> ${{ env.DH_IMAGE_NAME }}:${LATEST}-${VARIANT}"
          crane copy "${{ env.IMAGE_NAME }}:${LATEST}-${VARIANT}" "${{ env.DH_IMAGE_NAME }}:${LATEST}-${VARIANT}"

          if [ "$VARIANT" = default ]; then
            crane copy "${{ env.IMAGE_NAME }}:${VERSION}" "${{ env.DH_IMAGE_NAME }}:${VERSION}"
            crane copy "${{ env.IMAGE_NAME }}:${LATEST}" "${{ env.DH_IMAGE_NAME }}:${LATEST}"
          fi

      - name: Sign the Docker Hub copy (cosign keyless)
        run: |
          # crane copies the image (same digest) but not its signatures,
          # which live in the source repository: sign the copy too.
          VERSION="${{ needs.prepare.outputs.version }}"
          VARIANT="${{ matrix.variant }}"
          DIGEST="$(crane digest "${{ env.DH_IMAGE_NAME }}:${VERSION}-${VARIANT}")"
          cosign sign --yes --recursive "${{ env.DH_IMAGE_NAME }}@${DIGEST}"

      - name: Generate Docker Hub summary
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          VARIANT="${{ matrix.variant }}"
          LATEST="${{ needs.prepare.outputs.latest_suffix }}"
          echo "### ${VARIANT} (Docker Hub)" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ env.DH_IMAGE_NAME }}:${VERSION}-${VARIANT}" >> $GITHUB_STEP_SUMMARY
          echo "${{ env.DH_IMAGE_NAME }}:${LATEST}-${VARIANT}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
