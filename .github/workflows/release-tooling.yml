name: Release Tooling

# shellcheck + tests of .github/scripts/release (openctemio/openctem RFC-037).

on:
  pull_request:
    branches: [main]
    paths:
      - .github/scripts/release/**
      - .github/workflows/release*.yml
  push:
    branches: [main]
    paths:
      - .github/scripts/release/**
      - .github/workflows/release*.yml

permissions:
  contents: read

jobs:
  scripts:
    name: Release scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shellcheck
        run: shellcheck -x .github/scripts/release/*.sh .github/scripts/release/tests/*.sh
      - name: Tests
        run: bash .github/scripts/release/tests/run.sh
