name: Image Smoke Test

# Builds every published image variant and runs scripts/image-smoke-test.sh:
# each bundled tool must run and the sensor must report it available. The
# v0.3.0 images shipped a semgrep that died on import (pkg_resources), and
# the sensor skipped it silently; this catches that class before release.
# docker-publish.yml runs the same test before it pushes a tag's images.

on:
  pull_request:
    branches: [main]
    paths:
      - 'Dockerfile*'
      - 'docker/**'
      - 'scripts/image-smoke-test.sh'
      - 'scripts/nuclei-templates-bake.sh'
      - 'internal/content/**'
      - 'internal/scanners/nuclei/**'
      - '.github/workflows/image-smoke.yml'
      - '.github/workflows/docker-publish.yml'
      - 'go.mod'
      - 'go.sum'
      - 'main.go'
      - 'tool_status.go'
      - 'internal/tools/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke ${{ matrix.variant }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [default, ci, semgrep, trivy, nuclei, betterleaks]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build ${{ matrix.variant }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          # Same file/target selection as docker-publish.yml.
          file: ${{ (matrix.variant == 'default' || matrix.variant == 'ci') && 'Dockerfile' || format('Dockerfile.{0}', matrix.variant) }}
          target: ${{ matrix.variant == 'ci' && 'ci' || '' }}
          platforms: linux/amd64
          load: true
          tags: sensor-smoke:${{ matrix.variant }}
          provenance: false
          sbom: false

      - name: Smoke test
        run: scripts/image-smoke-test.sh "${{ matrix.variant }}" "sensor-smoke:${{ matrix.variant }}"
