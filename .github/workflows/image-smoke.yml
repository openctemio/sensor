name: Image Smoke Test

# Builds every published image variant and runs scripts/image-smoke-test.sh:
# each bundled tool must run and the sensor must report it available. The
# v0.3.0 images shipped a semgrep that died on import (pkg_resources), and
# the sensor skipped it silently; this catches that class before release.
# docker-publish.yml runs the same test before it pushes a tag's images.

on:
  pull_request:
    branches: [main]
    paths:
      - 'Dockerfile*'
      - 'docker/**'
      - 'scripts/image-smoke-test.sh'
      - 'scripts/nuclei-templates-bake.sh'
      - 'scripts/ci-mirror-contexts.sh'
      - 'internal/content/**'
      - 'internal/scanners/nuclei/**'
      - '.github/workflows/image-smoke.yml'
      - '.github/workflows/docker-publish.yml'
      - 'go.mod'
      - 'go.sum'
      - 'main.go'
      - 'tool_status.go'
      - 'internal/tools/**'
      - 'internal/webshot/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke ${{ matrix.variant }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [default, passive, full, browser, semgrep, opengrep, trivy, nuclei, betterleaks]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Digest-pinned public.ecr.aws bases come from the public CI image
      # mirror (same digest), so the anonymous public.ecr.aws quota of the
      # shared runner IP cannot fail the build (scripts/ci-mirror-contexts.sh).
      - name: Base images from the CI mirror
        id: bases
        env:
          FILE: ${{ (matrix.variant == 'default' || matrix.variant == 'passive' || matrix.variant == 'full' || matrix.variant == 'browser') && 'Dockerfile' || format('Dockerfile.{0}', matrix.variant) }}
        run: |
          eof="EOF$(openssl rand -hex 8)"
          { echo "contexts<<$eof"; scripts/ci-mirror-contexts.sh "$FILE"; echo "$eof"; } >> "$GITHUB_OUTPUT"

      # A registry error (rate limit, timeout) gets one retry after a pause.
      - name: Build ${{ matrix.variant }}
        id: build
        continue-on-error: true
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          # Same file/target selection as docker-publish.yml.
          file: ${{ (matrix.variant == 'default' || matrix.variant == 'passive' || matrix.variant == 'full' || matrix.variant == 'browser') && 'Dockerfile' || format('Dockerfile.{0}', matrix.variant) }}
          # passive, full and browser are targets of the main Dockerfile; default is its last stage.
          target: ${{ (matrix.variant == 'passive' || matrix.variant == 'full' || matrix.variant == 'browser') && matrix.variant || '' }}
          platforms: linux/amd64
          load: true
          tags: sensor-smoke:${{ matrix.variant }}
          provenance: false
          sbom: false
          build-contexts: ${{ steps.bases.outputs.contexts }}

      - name: Wait before retrying the build
        if: steps.build.outcome == 'failure'
        run: sleep 60

      - name: Build ${{ matrix.variant }} (retry)
        if: steps.build.outcome == 'failure'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          # Same file/target selection as docker-publish.yml.
          file: ${{ (matrix.variant == 'default' || matrix.variant == 'passive' || matrix.variant == 'full' || matrix.variant == 'browser') && 'Dockerfile' || format('Dockerfile.{0}', matrix.variant) }}
          # passive, full and browser are targets of the main Dockerfile; default is its last stage.
          target: ${{ (matrix.variant == 'passive' || matrix.variant == 'full' || matrix.variant == 'browser') && matrix.variant || '' }}
          platforms: linux/amd64
          load: true
          tags: sensor-smoke:${{ matrix.variant }}
          provenance: false
          sbom: false
          build-contexts: ${{ steps.bases.outputs.contexts }}

      - name: Smoke test
        run: scripts/image-smoke-test.sh "${{ matrix.variant }}" "sensor-smoke:${{ matrix.variant }}"

      # The browser image: the screenshot tool's tests against a real
      # Chromium with its own sandbox on, under the sensor's seccomp profile,
      # with no capability and no_new_privs (as a sensor runs): hostile
      # fixture pages, and the whole production path through the confined
      # task sandbox and the egress forwarder.
      - name: Setup Go
        if: matrix.variant == 'browser'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: true

      - name: Browser tests in the image
        if: matrix.variant == 'browser'
        run: |
          CGO_ENABLED=0 go test -c -o "$RUNNER_TEMP/webshot.test" ./internal/webshot
          docker run --rm --cap-drop ALL --security-opt no-new-privileges \
            --security-opt seccomp=docker/seccomp/sensor.json --tmpfs /tmp \
            -e OPENCTEM_TEST_REQUIRE_NETNS=1 -e WEBSHOT_BROWSER=/usr/lib/chromium/chromium-headless-shell \
            -v "$RUNNER_TEMP/webshot.test:/t/webshot.test:ro" --entrypoint /t/webshot.test \
            "sensor-smoke:${{ matrix.variant }}" -test.count=1 -test.v -test.run 'Real' 2>&1 \
            | grep -vE '^\[[0-9]{4}/' | tail -n 60
          exit "${PIPESTATUS[0]}"
