name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same PR or branch cancels the older run: force-pushed
# and rebased branches otherwise queue every superseded commit and starve the
# organisation's concurrent-job limit. Tags (releases) and the scheduled scan
# are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' && !startsWith(github.ref, 'refs/tags/') }}

# Least privilege: no job here writes to the repository.
permissions:
  contents: read

jobs:
  # Changelog entries live one file per change in changelog.d/, so pull
  # requests never conflict on CHANGELOG.md. Refuses an entry written under
  # the Unreleased heading, an invalid fragment, and merge-conflict markers in
  # any tracked text file.
  changelog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Changelog fragments and conflict markers
        run: python3 .github/scripts/release/changelog-fragments.py check

  # openctemio modules must be pinned to commits on their main branch
  # (a feature-branch pin breaks when that branch is squash-merged).
  deps-on-main:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: openctemio dependencies are on main
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: .github/scripts/check-deps-on-main.sh

  # docs.openctem.io links (page and anchor) and github.com/openctemio file
  # links in code and docs, against the docs site source (openctemio/docs
  # main) and the repositories they name.
  docs-links:
    name: Docs links
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: openctemio/docs
          ref: main
          path: .docs-site
          persist-credentials: false
      - name: Documentation links
        run: python3 scripts/check_docs_links.py --docs .docs-site --fetch-other .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Run tests
        run: go test -v -race ./...

  # The real nuclei binary (the version and SHA-256 the Dockerfile pins),
  # run out of process in a sandbox that confines its network to the task's
  # forwarder, keeps to a job's web scope (deny paths over HTTP and HTTPS,
  # in every spelling and behind a redirect). User namespaces need a
  # container whose seccomp profile allows them, as for the sensor itself.
  web-scope-netns:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NETNS_IMAGE: ghcr.io/openctemio/mirror/debian:bookworm-slim@sha256:3783cc01769c7b2b1b83a5c5ad96c815348e28ed7da68e2e3687004faa906251
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
          cache: true

      - name: Download the pinned nuclei
        run: |
          # The test only needs a nuclei binary: the release archive, pinned
          # here by SHA-256 (the images build nuclei from source instead).
          v=$(sed -n 's/^ARG NUCLEI_VERSION=//p' Dockerfile)
          sum=ea63d4ae232808cd7c6bc00d0142428e231fab59dae01042246097d195835ab6
          mkdir -p "$RUNNER_TEMP/netns"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/nuclei.zip" \
            "https://github.com/projectdiscovery/nuclei/releases/download/v${v}/nuclei_${v}_linux_amd64.zip"
          echo "${sum}  $RUNNER_TEMP/nuclei.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/nuclei.zip" nuclei -d "$RUNNER_TEMP/netns"

      - name: Build the test binary
        run: CGO_ENABLED=0 go test -c -o "$RUNNER_TEMP/netns/nuclei.test" ./internal/scanners/nuclei/

      - name: Pull the test container image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin >/dev/null 2>&1 \
            || echo "::notice::GHCR login failed; pulling anonymously"
          delay=10
          for i in 1 2 3 4 5; do
            docker pull -q "$NETNS_IMAGE" && exit 0
            [ "$i" -lt 5 ] && { echo "::warning::pull attempt $i failed; retrying in ${delay}s"; sleep "$delay"; delay=$((delay * 2)); }
          done
          exit 1

      - name: Run it confined
        run: |
          chmod -R a+rX "$RUNNER_TEMP/netns" .
          docker run --rm --user 23456:23456 --security-opt seccomp=unconfined \
            -e HOME=/tmp -e OPENCTEM_TEST_REQUIRE_NETNS=1 -e NUCLEI_REAL_BIN=/t/nuclei \
            -v "$RUNNER_TEMP/netns:/t:ro" -v "$PWD/internal/scanners/nuclei:/src:ro" -w /src \
            "$NETNS_IMAGE" \
            /t/nuclei.test -test.v -test.count=1 -test.run 'RealNucleiKeepsToWebScope|RealNucleiThroughThePool'

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Actions are pinned to commit SHAs
        run: bash .github/scripts/check-action-pins.sh

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # pinned (was latest) — avoid CI-breaking tool drift
          version: v2.13.1

      # Complete agent -> sensor rename (RFC-023 §9.5): fails when an
      # identifier or comment in either build still uses the old vocabulary.
      - name: Sensor vocabulary (rename is complete)
        run: go run ./scripts/rename/sensorrename -check

      # BuildKit sets TARGETARCH/TARGETOS per platform, but only when the ARG
      # has no default: `ARG TARGETARCH=amd64` silently built amd64 binaries
      # into the arm64 images (v0.3.0, v0.4.0).
      - name: Dockerfiles leave TARGETARCH/TARGETOS to BuildKit
        run: |
          if grep -nE '^ARG TARGET(ARCH|OS|PLATFORM|VARIANT)=' Dockerfile*; then
            echo "::error::Do not give TARGET* build args a default; BuildKit sets them per platform."
            exit 1
          fi

      # The images bake one nuclei-templates release, verified by the SHA-256
      # pinned next to it (scripts/nuclei-templates-bake.sh). Every
      # Dockerfile that bakes it must pin the same release and digest, or two
      # images of one sensor version report different template sets.
      - name: Dockerfiles pin one nuclei-templates release
        run: |
          for arg in NUCLEI_TEMPLATES_VERSION NUCLEI_TEMPLATES_SHA256; do
            values=$(grep -hE "^ARG ${arg}=" Dockerfile Dockerfile.nuclei | sort -u)
            if [ "$(printf '%s\n' "$values" | grep -c .)" -ne 1 ]; then
              echo "::error::${arg} differs between Dockerfile and Dockerfile.nuclei: ${values}"
              exit 1
            fi
          done

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
          cache: true

      - name: Build
        run: |
          go build -v -o openctemio-sensor-${{ matrix.goos }}-${{ matrix.goarch }} .
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openctemio-sensor-${{ matrix.goos }}-${{ matrix.goarch }}
          path: openctemio-sensor-${{ matrix.goos }}-${{ matrix.goarch }}
