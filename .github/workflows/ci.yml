name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same PR or branch cancels the older run: force-pushed
# and rebased branches otherwise queue every superseded commit and starve the
# organisation's concurrent-job limit. Tags (releases) and the scheduled scan
# are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' && !startsWith(github.ref, 'refs/tags/') }}

# Least privilege: no job here writes to the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.8'
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Run tests
        run: go test -v -race ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Actions are pinned to commit SHAs
        run: bash .github/scripts/check-action-pins.sh

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.8'
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # pinned (was latest) — avoid CI-breaking tool drift
          version: v2.13.1

      # Complete agent -> sensor rename (RFC-023 §9.5): fails when an
      # identifier or comment in either build still uses the old vocabulary.
      - name: Sensor vocabulary (rename is complete)
        run: go run ./scripts/rename/sensorrename -check

      # BuildKit sets TARGETARCH/TARGETOS per platform, but only when the ARG
      # has no default: `ARG TARGETARCH=amd64` silently built amd64 binaries
      # into the arm64 images (v0.3.0, v0.4.0).
      - name: Dockerfiles leave TARGETARCH/TARGETOS to BuildKit
        run: |
          if grep -nE '^ARG TARGET(ARCH|OS|PLATFORM|VARIANT)=' Dockerfile*; then
            echo "::error::Do not give TARGET* build args a default; BuildKit sets them per platform."
            exit 1
          fi

      # The images bake one nuclei-templates release, verified by the SHA-256
      # pinned next to it (scripts/nuclei-templates-bake.sh). Every
      # Dockerfile that bakes it must pin the same release and digest, or two
      # images of one sensor version report different template sets.
      - name: Dockerfiles pin one nuclei-templates release
        run: |
          for arg in NUCLEI_TEMPLATES_VERSION NUCLEI_TEMPLATES_SHA256; do
            values=$(grep -hE "^ARG ${arg}=" Dockerfile Dockerfile.nuclei | sort -u)
            if [ "$(printf '%s\n' "$values" | grep -c .)" -ne 1 ]; then
              echo "::error::${arg} differs between Dockerfile and Dockerfile.nuclei: ${values}"
              exit 1
            fi
          done

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.8'
          cache: true

      - name: Build
        run: |
          go build -v -o openctemio-sensor-${{ matrix.goos }}-${{ matrix.goarch }} .
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openctemio-sensor-${{ matrix.goos }}-${{ matrix.goarch }}
          path: openctemio-sensor-${{ matrix.goos }}-${{ matrix.goarch }}
