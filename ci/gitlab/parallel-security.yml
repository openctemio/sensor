# OpenCTEM Parallel Security Scanning - GitLab CI
#
# Runs SAST, Secrets, and SCA scans in PARALLEL for faster CI.
# Total time = max(sast, secrets, sca) instead of sum.
#
# Usage:
#   include:
#     - remote: 'https://raw.githubusercontent.com/openctemio/sensor/main/ci/gitlab/parallel-security.yml'
#
#   stages:
#     - security
#
#   # All 3 jobs run in parallel automatically
#
# For more options, see: https://docs.openctem.io/ci/gitlab
#
# =============================================================================
# Tool Update Mechanism
# =============================================================================
# SEMGREP: Rules fetched from Registry on every scan (always fresh)
# TRIVY: DB auto-downloads on first use, updates every 6 hours
# BETTERLEAKS: Rules embedded in binary, update by pulling latest image
# =============================================================================

# =============================================================================
# Variables (Override in your .gitlab-ci.yml)
# =============================================================================
variables:
  # The sensor images run as a non-root user (uid 1001); GitLab's checkout is
  # owned by another user, so git would refuse it as "dubious ownership".
  # Trust exactly this job's checkout.
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: safe.directory
  GIT_CONFIG_VALUE_0: $CI_PROJECT_DIR
  # Push results to platform (CI identity via OPENCTEM_TENANT_ID, or API_KEY)
  # Set to "false" for testing or when API_KEY is not available
  PUSH: "true"

  # Enable PR/MR comments
  COMMENTS: "true"

  # Security gate threshold
  FAIL_ON: "critical"

  # Enable verbose output
  VERBOSE: "false"

# =============================================================================
# SAST - Static Application Security Testing (Semgrep)
# =============================================================================
openctem-sast:
  stage: security
  # CI identity (api RFC-051): the job's ID token is exchanged for a run token
  # that lives at most 15 minutes, so no API key is stored. Set API_URL and
  # OPENCTEM_TENANT_ID in Settings > CI/CD > Variables; a trust configuration
  # with a custom audience overrides aud.
  id_tokens:
    OPENCTEM_ID_TOKEN:
      aud: "openctem:tenant:$OPENCTEM_TENANT_ID"
  image:
    name: ghcr.io/openctemio/sensor:v0.9.1-semgrep@sha256:45211a51136f5e87de51b50e548e3a9292d1ac974f4fbd503ef23dbd36f91d6a
    entrypoint: [""]
  variables:
    GIT_DEPTH: 0
  before_script:
    - |
      if [ "$PUSH" = "true" ] && [ -z "$API_KEY" ] && [ -z "$OPENCTEM_TENANT_ID" ]; then
        echo "Info: neither OPENCTEM_TENANT_ID (CI identity) nor API_KEY is set. Push disabled (scan-only mode)."
        export PUSH="false"
      fi
  script:
    - |
      VERBOSE_FLAG=""
      PUSH_FLAG=""
      COMMENTS_FLAG=""
      if [ "$VERBOSE" = "true" ]; then
        VERBOSE_FLAG="-verbose"
      fi
      if [ "$PUSH" = "true" ]; then
        PUSH_FLAG="-push"
      fi
      if [ "$COMMENTS" = "true" ]; then
        COMMENTS_FLAG="-comments"
      fi

      openctemio-sensor -tool semgrep \
        -target . \
        -auto-ci \
        $PUSH_FLAG \
        $COMMENTS_FLAG \
        -fail-on $FAIL_ON \
        -output-format sarif \
        -output gl-sast-report.json \
        $VERBOSE_FLAG
  artifacts:
    reports:
      sast: gl-sast-report.json
    paths:
      - gl-sast-report.json
    when: always
    expire_in: 1 week
  allow_failure:
    exit_codes:
      - 1
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

