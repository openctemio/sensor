# =============================================================================
# SCA - Software Composition Analysis (Trivy)
# =============================================================================
openctem-sca:
  stage: security
  # CI identity (api RFC-051): the job's ID token is exchanged for a run token
  # that lives at most 15 minutes, so no API key is stored. Set API_URL and
  # OPENCTEM_TENANT_ID in Settings > CI/CD > Variables; a trust configuration
  # with a custom audience overrides aud.
  id_tokens:
    OPENCTEM_ID_TOKEN:
      aud: "openctem:tenant:$OPENCTEM_TENANT_ID"
  image:
    name: ghcr.io/openctemio/sensor:v0.9.1-trivy@sha256:28ddc45b73b99b357280580ce8ca6ccaf38beb728917dbe4f60fc519323c51ee
    entrypoint: [""]
  variables:
    TRIVY_CACHE_DIR: /cache/trivy
  cache:
    key: trivy-db-${CI_COMMIT_REF_SLUG}
    paths:
      - /cache/trivy
    policy: pull-push
  before_script:
    - |
      if [ "$PUSH" = "true" ] && [ -z "$API_KEY" ] && [ -z "$OPENCTEM_TENANT_ID" ]; then
        echo "Info: neither OPENCTEM_TENANT_ID (CI identity) nor API_KEY is set. Push disabled (scan-only mode)."
        export PUSH="false"
      fi
      mkdir -p /cache/trivy
      echo "Trivy will download/update vulnerability DB if needed..."
  script:
    - |
      VERBOSE_FLAG=""
      PUSH_FLAG=""
      if [ "$VERBOSE" = "true" ]; then
        VERBOSE_FLAG="-verbose"
      fi
      if [ "$PUSH" = "true" ]; then
        PUSH_FLAG="-push"
      fi

      openctemio-sensor -tool trivy \
        -target . \
        -auto-ci \
        $PUSH_FLAG \
        -fail-on $FAIL_ON \
        -output-format sarif \
        -output gl-dependency-scanning-report.json \
        $VERBOSE_FLAG
  artifacts:
    reports:
      dependency_scanning: gl-dependency-scanning-report.json
    paths:
      - gl-dependency-scanning-report.json
    when: always
    expire_in: 1 week
  allow_failure:
    exit_codes:
      - 1
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# =============================================================================
# Security Summary (Optional - runs after all scans)
# =============================================================================
openctem-summary:
  stage: security
  # CI identity (api RFC-051): the job's ID token is exchanged for a run token
  # that lives at most 15 minutes, so no API key is stored. Set API_URL and
  # OPENCTEM_TENANT_ID in Settings > CI/CD > Variables; a trust configuration
  # with a custom audience overrides aud.
  id_tokens:
    OPENCTEM_ID_TOKEN:
      aud: "openctem:tenant:$OPENCTEM_TENANT_ID"
  image: alpine:latest
  needs:
    - job: openctem-sast
      artifacts: true
    - job: openctem-secrets
      artifacts: true
    - job: openctem-sca
      artifacts: true
  before_script:
    - apk add --no-cache jq
  script:
    - |
      echo "=== Security Scan Summary ==="
      echo ""

      SAST_COUNT=0
      SECRETS_COUNT=0
      SCA_COUNT=0

      if [ -f gl-sast-report.json ]; then
        SAST_COUNT=$(jq '[.runs[].results[]] | length' gl-sast-report.json 2>/dev/null || echo 0)
      fi

      if [ -f gl-secret-detection-report.json ]; then
        SECRETS_COUNT=$(jq '[.runs[].results[]] | length' gl-secret-detection-report.json 2>/dev/null || echo 0)
      fi

      if [ -f gl-dependency-scanning-report.json ]; then
        SCA_COUNT=$(jq '[.runs[].results[]] | length' gl-dependency-scanning-report.json 2>/dev/null || echo 0)
      fi

      TOTAL=$((SAST_COUNT + SECRETS_COUNT + SCA_COUNT))

      echo "SAST (Semgrep):      $SAST_COUNT findings"
      echo "Secrets (Betterleaks):  $SECRETS_COUNT findings"
      echo "SCA (Trivy):         $SCA_COUNT findings"
      echo "----------------------------"
      echo "Total:               $TOTAL findings"
      echo ""

      # Create summary artifact
      cat > security-summary.json << EOF
      {
        "sast": $SAST_COUNT,
        "secrets": $SECRETS_COUNT,
        "sca": $SCA_COUNT,
        "total": $TOTAL,
        "pipeline_id": "$CI_PIPELINE_ID",
        "commit": "$CI_COMMIT_SHA",
        "branch": "$CI_COMMIT_REF_NAME"
      }
      EOF

      echo "Summary saved to security-summary.json"
  artifacts:
    paths:
      - security-summary.json
    when: always
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  allow_failure: true
