# OpenCTEM Security Scanning - Reusable GitHub Actions Workflow
#
# Usage:
#   jobs:
#     security:
#       uses: openctemio/sensor/.github/workflows/openctem-security.yml@main
#       with:
#         tools: "semgrep,betterleaks,trivy"
#         fail_on: "high"
#         tenant_id: "<your organization id>"   # CI identity: no API key
#       permissions:
#         contents: read
#         id-token: write
#         pull-requests: write
#         security-events: write
#       secrets:
#         api_url: ${{ secrets.API_URL }}
#
# Or use individual jobs with per-tool images:
#   jobs:
#     sast:
#       uses: openctemio/sensor/.github/workflows/openctem-security.yml@main
#       with:
#         scan_type: "sast"
#         fail_on: "high"
#
# For more options, see: https://docs.openctem.io/ci/github
#
# =============================================================================
# Tool Update Mechanism
# =============================================================================
# SEMGREP: Rules fetched from Registry on every scan (always fresh)
# TRIVY: DB auto-downloads on first use, updates every 6 hours
# BETTERLEAKS: Rules embedded in binary, update by pulling latest image
# NUCLEI: Templates auto-update on first run (DAST only, not in CI)
# =============================================================================

name: OpenCTEM Security Scan

on:
  workflow_call:
    inputs:
      # Scan type for per-tool scanning
      # CI types: full, sast, sca, secrets, iac, container
      # DAST types: dast (separate workflow, not for PR checks)
      scan_type:
        description: 'Scan type: full, sast, sca, secrets, iac, container, dast'
        type: string
        default: 'full'
        required: false

      # Tools to run (for full scan) - excludes nuclei
      tools:
        description: 'Comma-separated list of CI tools (e.g., "semgrep,betterleaks,trivy")'
        type: string
        default: 'semgrep,betterleaks,trivy'
        required: false

      # Security gate
      enforce_gate:
        description: 'Fail the job when a scan step failed (gate verdict fail, or an error). Off: rollout mode, results are reported but the job passes'
        type: boolean
        default: false
        required: false
      fail_on:
        description: 'Fail if findings >= severity (critical, high, medium, low)'
        type: string
        default: 'critical'
        required: false

      # Target path
      target:
        description: 'Target path to scan'
        type: string
        default: '.'
        required: false

      # DAST target URL (for dast scan_type only)
      target_url:
        description: 'Target URL for DAST scanning (requires running application)'
        type: string
        default: ''
        required: false

      # Container image (for container scan_type)
      container_image:
        description: 'Container image to scan'
        type: string
        default: ''
        required: false

      # PR comments
      comments:
        description: 'Post findings as PR comments'
        type: boolean
        default: true
        required: false

      # Verbose output
      verbose:
        description: 'Enable verbose output'
        type: boolean
        default: false
        required: false

      # Push to OpenCTEM
      push:
        description: 'Push results to OpenCTEM platform'
        type: boolean
        default: true
        required: false

      # Output file
      sarif_file:
        description: 'SARIF output file path'
        type: string
        default: 'openctem-results.sarif'
        required: false

      # Upload to GitHub Security tab
      upload_sarif:
        description: 'Upload SARIF to GitHub Security tab'
        type: boolean
        default: true
        required: false

      # Update Nuclei templates (for DAST only)
      update_templates:
        description: 'Update Nuclei templates before DAST scan'
        type: boolean
        default: true
        required: false

      # CI identity (api RFC-051): with tenant_id set and the caller granting
      # id-token: write, the job's OIDC token replaces the API key.
      tenant_id:
        description: 'OpenCTEM organization id (CI identity; no API key needed)'
        type: string
        default: ''
        required: false
      oidc_audience:
        description: 'OIDC audience, when the trust configuration does not use the default openctem:tenant:<id>'
        type: string
        default: ''
        required: false

    secrets:
      api_url:
        description: 'OpenCTEM API URL'
        required: false
      api_key:
        description: 'OpenCTEM API key (deprecated for CI: use tenant_id and id-token: write)'
        required: false

    outputs:
      findings_count:
        description: 'Total number of findings'
        value: ${{ jobs.scan.outputs.findings_count }}
      critical_count:
        description: 'Number of critical findings'
        value: ${{ jobs.scan.outputs.critical_count }}
      high_count:
        description: 'Number of high findings'
        value: ${{ jobs.scan.outputs.high_count }}

jobs:
  scan:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # CI identity (api RFC-051)
      pull-requests: write
      security-events: write

    outputs:
      findings_count: ${{ steps.scan.outputs.findings_count }}
      critical_count: ${{ steps.scan.outputs.critical_count }}
      high_count: ${{ steps.scan.outputs.high_count }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ==========================================================================
      # Full CI Scan (SAST + Secrets + SCA, NO DAST)
      # Uses ghcr.io/openctemio/sensor:v0.9.1-ci@sha256:97f5512165d2c79240bb01f4cdbc710b85b1517cca95d4015aa39d35c60017e1 (semgrep, betterleaks, trivy)
      # ==========================================================================
      - name: Full CI Security Scan
        id: scan
        if: inputs.scan_type == 'full'
        uses: docker://ghcr.io/openctemio/sensor:v0.9.1-ci@sha256:97f5512165d2c79240bb01f4cdbc710b85b1517cca95d4015aa39d35c60017e1
        with:
          args: >-
            -tools ${{ inputs.tools }}
            -target ${{ inputs.target }}
            -auto-ci
            ${{ inputs.comments && '-comments' || '' }}
            ${{ inputs.push && '-push' || '' }}
            ${{ inputs.verbose && '-verbose' || '' }}
            -fail-on ${{ inputs.fail_on }}
            -output-format sarif
            -output ${{ inputs.sarif_file }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API_URL: ${{ secrets.api_url }}
          API_KEY: ${{ secrets.api_key }}
          OPENCTEM_TENANT_ID: ${{ inputs.tenant_id }}
          OPENCTEM_OIDC_AUDIENCE: ${{ inputs.oidc_audience }}
        continue-on-error: true

      # ==========================================================================
      # SAST Scan (Semgrep - rules auto-fetched from Registry)
      # ==========================================================================
      - name: SAST Scan
        if: inputs.scan_type == 'sast'
        uses: docker://ghcr.io/openctemio/sensor:v0.9.1-semgrep@sha256:45211a51136f5e87de51b50e548e3a9292d1ac974f4fbd503ef23dbd36f91d6a
        with:
          args: >-
            -tool semgrep
            -target ${{ inputs.target }}
            -auto-ci
            ${{ inputs.comments && '-comments' || '' }}
            ${{ inputs.push && '-push' || '' }}
            ${{ inputs.verbose && '-verbose' || '' }}
            -fail-on ${{ inputs.fail_on }}
            -output-format sarif
            -output ${{ inputs.sarif_file }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API_URL: ${{ secrets.api_url }}
          API_KEY: ${{ secrets.api_key }}
          OPENCTEM_TENANT_ID: ${{ inputs.tenant_id }}
          OPENCTEM_OIDC_AUDIENCE: ${{ inputs.oidc_audience }}
        continue-on-error: true

      # ==========================================================================
      # SCA Scan (Trivy - DB auto-downloads, updates every 6h)
      # ==========================================================================
      - name: SCA Scan
        if: inputs.scan_type == 'sca'
        uses: docker://ghcr.io/openctemio/sensor:v0.9.1-trivy@sha256:28ddc45b73b99b357280580ce8ca6ccaf38beb728917dbe4f60fc519323c51ee
        with:
          args: >-
            -tool trivy
            -target ${{ inputs.target }}
            -auto-ci
            ${{ inputs.push && '-push' || '' }}
            ${{ inputs.verbose && '-verbose' || '' }}
            -fail-on ${{ inputs.fail_on }}
            -output-format sarif
            -output ${{ inputs.sarif_file }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API_URL: ${{ secrets.api_url }}
          API_KEY: ${{ secrets.api_key }}
          OPENCTEM_TENANT_ID: ${{ inputs.tenant_id }}
          OPENCTEM_OIDC_AUDIENCE: ${{ inputs.oidc_audience }}
        continue-on-error: true

      # ==========================================================================
      # Secrets Scan (Betterleaks - rules in binary)
      # ==========================================================================
      - name: Secrets Scan
        if: inputs.scan_type == 'secrets'
        uses: docker://ghcr.io/openctemio/sensor:v0.9.1-betterleaks@sha256:77f5b257ac12887b7a47f20eb1dbc16aaefdca35d064019d41dfbd5b62a4a6b5
        with:
          args: >-
            -tool betterleaks
            -target ${{ inputs.target }}
            -auto-ci
            ${{ inputs.comments && '-comments' || '' }}
            ${{ inputs.push && '-push' || '' }}
            ${{ inputs.verbose && '-verbose' || '' }}
            -fail-on ${{ inputs.fail_on }}
            -output-format sarif
            -output ${{ inputs.sarif_file }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API_URL: ${{ secrets.api_url }}
          API_KEY: ${{ secrets.api_key }}
          OPENCTEM_TENANT_ID: ${{ inputs.tenant_id }}
          OPENCTEM_OIDC_AUDIENCE: ${{ inputs.oidc_audience }}
        continue-on-error: true

      # ==========================================================================
      # IaC Scan (Trivy config mode)
      # ==========================================================================
      - name: IaC Scan
        if: inputs.scan_type == 'iac'
        uses: docker://ghcr.io/openctemio/sensor:v0.9.1-trivy@sha256:28ddc45b73b99b357280580ce8ca6ccaf38beb728917dbe4f60fc519323c51ee
        with:
          args: >-
            -tool trivy-config
            -target ${{ inputs.target }}
            -auto-ci
            ${{ inputs.push && '-push' || '' }}
            ${{ inputs.verbose && '-verbose' || '' }}
            -fail-on ${{ inputs.fail_on }}
            -output-format sarif
            -output ${{ inputs.sarif_file }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API_URL: ${{ secrets.api_url }}
          API_KEY: ${{ secrets.api_key }}
          OPENCTEM_TENANT_ID: ${{ inputs.tenant_id }}
          OPENCTEM_OIDC_AUDIENCE: ${{ inputs.oidc_audience }}
        continue-on-error: true

      # ==========================================================================
      # Container Scan (Trivy image mode)
      # ==========================================================================
      - name: Container Scan
        if: inputs.scan_type == 'container' && inputs.container_image != ''
        uses: docker://ghcr.io/openctemio/sensor:v0.9.1-trivy@sha256:28ddc45b73b99b357280580ce8ca6ccaf38beb728917dbe4f60fc519323c51ee
        with:
          args: >-
            -tool trivy-image
            -target ${{ inputs.container_image }}
            -auto-ci
            ${{ inputs.push && '-push' || '' }}
            ${{ inputs.verbose && '-verbose' || '' }}
            -fail-on ${{ inputs.fail_on }}
            -output-format sarif
            -output ${{ inputs.sarif_file }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API_URL: ${{ secrets.api_url }}
          API_KEY: ${{ secrets.api_key }}
          OPENCTEM_TENANT_ID: ${{ inputs.tenant_id }}
          OPENCTEM_OIDC_AUDIENCE: ${{ inputs.oidc_audience }}
        continue-on-error: true

      # ==========================================================================
      # DAST Scan (Nuclei - SEPARATE from CI workflow)
      # NOTE: DAST requires a running application. Use this in a separate
      # workflow triggered after deployment, not in PR checks.
      # ==========================================================================
      - name: Update Nuclei Templates
        if: inputs.scan_type == 'dast' && inputs.target_url != '' && inputs.update_templates
        run: |
          docker run --rm --entrypoint nuclei ghcr.io/openctemio/sensor:v0.9.1-nuclei@sha256:17d989f026dd2c1bbffbb903c588a4f52aeab20d4d6e42d1f495a1076a7c22ab -update-templates 2>/dev/null || true

      - name: DAST Scan
        if: inputs.scan_type == 'dast' && inputs.target_url != ''
        uses: docker://ghcr.io/openctemio/sensor:v0.9.1-nuclei@sha256:17d989f026dd2c1bbffbb903c588a4f52aeab20d4d6e42d1f495a1076a7c22ab
        with:
          args: >-
            -tool nuclei
            -target ${{ inputs.target_url }}
            -auto-ci
            ${{ inputs.push && '-push' || '' }}
            ${{ inputs.verbose && '-verbose' || '' }}
            -fail-on ${{ inputs.fail_on }}
            -output-format sarif
            -output ${{ inputs.sarif_file }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API_URL: ${{ secrets.api_url }}
          API_KEY: ${{ secrets.api_key }}
          OPENCTEM_TENANT_ID: ${{ inputs.tenant_id }}
          OPENCTEM_OIDC_AUDIENCE: ${{ inputs.oidc_audience }}
        continue-on-error: true

      # ==========================================================================
      # Upload SARIF to GitHub Security Tab
      # ==========================================================================
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: inputs.upload_sarif && always()
        with:
          sarif_file: ${{ inputs.sarif_file }}
        continue-on-error: true

      # ==========================================================================
      # Upload Artifacts
      # ==========================================================================
      - name: Upload Scan Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: openctem-security-results
          path: ${{ inputs.sarif_file }}
          retention-days: 30

      # Every scan step above continues on error so the results are always
      # uploaded; with enforce_gate the job fails when any of them failed.
      - name: Enforce the security gate
        if: always() && inputs.enforce_gate && contains(steps.*.outcome, 'failure')
        run: |
          echo "::error::the OpenCTEM security gate failed (see the scan step output for the verdict and blocking findings)"
          exit 1
