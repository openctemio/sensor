# Tool descriptor of katana (OpenCTEM Tool Contract v1), embedded in the sensor.
# The single source of this tool's contract: the sensor loads it at start,
# reports it to the platform by digest and enforces it on every task.
apiVersion: openctem.io/tool/v1
name: katana
version: 2.1.0
description: Web crawler for URL and endpoint discovery on the target's host (ProjectDiscovery katana).
publisher: openctemio
engine:
  name: katana
  license: MIT
presentation:
  display_name: Katana
  category: web
  icon: link
class: target-scan
tier: T1
implements:
- capability: crawl.web@1
  params:
    depth: {key: depth}
    js_parse: {key: js_parse}
    max_urls: {key: max_urls}
consumes: [http_service, website, web_application]
produces: ['asset:discovered_url']
input:
  batch: list
# The configuration schema scans are validated against (JSON in YAML).
config:
  {
    "$schema": "https://json-schema.org/draft/2020-12/schema",
    "x-octm-schema-version": 1,
    "title": "katana",
    "type": "object",
    "additionalProperties": false,
    "properties": {
      "depth": {
        "type": "integer",
        "minimum": 1,
        "maximum": 10,
        "title": "Depth",
        "description": "Maximum crawl depth (katana -depth). Default: 3.",
        "x-octm-scope": "scan",
        "x-octm-order": 10
      },
      "js_parse": {
        "type": "boolean",
        "title": "Parse JavaScript",
        "description": "Parse JavaScript files for endpoints (katana -js-crawl). Default: on.",
        "x-octm-scope": "scan",
        "x-octm-order": 20
      },
      "max_urls": {
        "type": "integer",
        "minimum": 1,
        "maximum": 5000,
        "title": "Maximum URLs",
        "description": "Keep at most this many URLs per start URL; the rest are not reported.",
        "x-octm-scope": "scan",
        "x-octm-order": 30
      }
    }
  }
# katana keeps to the job's web scope (webscope.go).
features:
  web_scope: true
permissions:
  network: targets
resources:
  timeout: 24h0m0s
  max_output_bytes: 268435456
  max_records: 1000000
safety:
  expands_targets: true
