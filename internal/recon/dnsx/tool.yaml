# Tool descriptor of dnsx (OpenCTEM Tool Contract v1), embedded in the sensor.
# The single source of this tool's contract: the sensor loads it at start,
# reports it to the platform by digest and enforces it on every task.
apiVersion: openctem.io/tool/v1
name: dnsx
version: 2.1.0
description: DNS resolution of domains and subdomains through the sensor's resolvers (ProjectDiscovery dnsx).
publisher: openctemio
engine:
  name: dnsx
  license: MIT
presentation:
  display_name: dnsx
  category: dns
  icon: globe
class: target-scan
tier: T0
implements:
- capability: resolve.dns@1
  params:
    record_types: {key: record_types}
    wildcard_filter: {key: wildcard_filter}
consumes: [domain, subdomain]
produces: ['asset:domain']
input:
  batch: list
# The configuration schema scans are validated against (JSON in YAML).
config:
  {
    "$schema": "https://json-schema.org/draft/2020-12/schema",
    "x-octm-schema-version": 1,
    "title": "dnsx",
    "type": "object",
    "additionalProperties": false,
    "properties": {
      "record_types": {
        "type": "array",
        "minItems": 1,
        "maxItems": 6,
        "uniqueItems": true,
        "items": {
          "enum": [
            "a",
            "aaaa",
            "cname",
            "mx",
            "ns",
            "txt"
          ]
        },
        "title": "Record types",
        "description": "DNS record types to query (dnsx -a, -aaaa, -cname, -mx, -ns, -txt). Default: a, aaaa, cname.",
        "x-octm-scope": "scan",
        "x-octm-order": 10
      },
      "wildcard_filter": {
        "type": "boolean",
        "title": "Filter wildcards",
        "description": "Drop names that resolve only through a wildcard record (dnsx -auto-wildcard).",
        "x-octm-scope": "scan",
        "x-octm-order": 20
      }
    }
  }
permissions:
  network: resolver
resources:
  timeout: 24h0m0s
  max_output_bytes: 268435456
  max_records: 1000000
