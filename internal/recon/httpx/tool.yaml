# Tool descriptor of httpx (OpenCTEM Tool Contract v1), embedded in the sensor.
# The single source of this tool's contract: the sensor loads it at start,
# reports it to the platform by digest and enforces it on every task.
apiVersion: openctem.io/tool/v1
name: httpx
version: 2.0.0
description: 'HTTP probe: live web services, titles, servers, technologies, TLS leaf certificates (ProjectDiscovery httpx).'
publisher: openctemio
engine:
  name: httpx
  license: MIT
presentation:
  display_name: httpx
  category: web
  icon: globe
class: target-scan
tier: T1
implements:
- capability: probe.http@1
  params:
    ports: {key: ports}
    follow_redirects: {key: follow_redirects}
    tech_detect: {key: tech_detect}
    tls_grab: {key: tls_grab}
consumes: [domain, subdomain, ip_address, host, http_service, open_port, service, website]
produces: ['asset:http_service', 'asset:certificate']
input:
  batch: list
# The configuration schema scans are validated against (JSON in YAML).
config:
  {
    "$schema": "https://json-schema.org/draft/2020-12/schema",
    "x-octm-schema-version": 1,
    "title": "httpx",
    "type": "object",
    "additionalProperties": false,
    "properties": {
      "ports": {
        "type": "string",
        "minLength": 1,
        "maxLength": 2048,
        "pattern": "^[0-9]{1,5}(?:-[0-9]{1,5})?(?:,[0-9]{1,5}(?:-[0-9]{1,5})?)*$",
        "title": "Ports",
        "description": "Ports to probe on a host or address target, e.g. 80,443,8000-8100 (httpx -ports). Default: the scheme's port.",
        "x-octm-flag": "-ports",
        "x-octm-scope": "scan",
        "x-octm-order": 10
      },
      "follow_redirects": {
        "type": "boolean",
        "title": "Follow redirects",
        "description": "Follow redirects on the same host (httpx -follow-host-redirects). Default: on.",
        "x-octm-flag": "-follow-host-redirects",
        "x-octm-scope": "scan",
        "x-octm-order": 20
      },
      "tech_detect": {
        "type": "boolean",
        "title": "Technology detection",
        "description": "Detect the technologies a page uses (httpx -tech-detect). Default: on.",
        "x-octm-flag": "-tech-detect",
        "x-octm-scope": "scan",
        "x-octm-order": 30
      },
      "tls_grab": {
        "type": "boolean",
        "title": "TLS certificate",
        "description": "Record the TLS leaf certificate (httpx -tls-grab). Default: on.",
        "x-octm-flag": "-tls-grab",
        "x-octm-scope": "scan",
        "x-octm-order": 40
      },
      "rate_limit": {
        "type": "integer",
        "minimum": 1,
        "maximum": 5000,
        "default": 150,
        "title": "Rate limit",
        "description": "Most requests per second across all targets (httpx -rate-limit). Only the sensor's settings may raise it above the default; a scan or a job may lower it.",
        "x-octm-common": "rate",
        "x-octm-flag": "-rl",
        "x-octm-scope": "scan",
        "x-octm-group": "Performance",
        "x-octm-order": 110
      },
      "threads": {
        "type": "integer",
        "minimum": 1,
        "maximum": 500,
        "default": 50,
        "title": "Threads",
        "description": "Requests in flight at once (httpx -threads). Only the sensor's settings may raise it above the default.",
        "x-octm-common": "concurrency",
        "x-octm-flag": "-threads",
        "x-octm-scope": "scan",
        "x-octm-group": "Performance",
        "x-octm-order": 120
      },
      "timeout": {
        "type": "integer",
        "minimum": 1,
        "maximum": 60,
        "default": 10,
        "title": "Request timeout",
        "description": "Seconds to wait for one response (httpx -timeout). A job's per-target budget may shorten it.",
        "x-octm-common": "timeout",
        "x-octm-flag": "-timeout",
        "x-octm-scope": "scan",
        "x-octm-group": "Performance",
        "x-octm-order": 130
      },
      "retries": {
        "type": "integer",
        "minimum": 0,
        "maximum": 5,
        "default": 2,
        "title": "Retries",
        "description": "Times a failed request is retried (httpx -retries).",
        "x-octm-common": "retries",
        "x-octm-flag": "-retries",
        "x-octm-scope": "scan",
        "x-octm-group": "Performance",
        "x-octm-order": 140
      }
    }
  }
features:
  http_identity: true
permissions:
  network: targets
resources:
  profile: standard
  timeout: 24h0m0s
  max_output_bytes: 268435456
  max_records: 1000000
