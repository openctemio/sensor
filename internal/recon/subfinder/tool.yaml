# Tool descriptor of subfinder (OpenCTEM Tool Contract v1), embedded in the sensor.
# The single source of this tool's contract: the sensor loads it at start,
# reports it to the platform by digest and enforces it on every task.
apiVersion: openctem.io/tool/v1
name: subfinder
version: 2.1.0
description: Passive subdomain enumeration from public sources (ProjectDiscovery subfinder); never contacts the target.
publisher: openctemio
engine:
  name: subfinder
  license: MIT
presentation:
  display_name: Subfinder
  category: dns
  icon: search
class: target-scan
tier: T0
implements:
- capability: discover.subdomains@1
  params:
    sources: {key: sources}
    recursive: {key: recursive}
    max_results: {key: max_results}
consumes: [domain_name]
produces: ['asset:domain_name']
input:
  batch: list
# The configuration schema scans are validated against (JSON in YAML).
config:
  {
    "$schema": "https://json-schema.org/draft/2020-12/schema",
    "x-octm-schema-version": 1,
    "title": "subfinder",
    "type": "object",
    "additionalProperties": false,
    "properties": {
      "sources": {
        "type": "array",
        "minItems": 1,
        "maxItems": 64,
        "uniqueItems": true,
        "items": {
          "type": "string",
          "pattern": "^[a-z0-9]{1,32}$"
        },
        "title": "Sources",
        "description": "Query only these passive sources (subfinder -sources), e.g. crtsh, hackertarget. Default: the sensor's sources.",
        "x-octm-flag": "-sources",
        "x-octm-scope": "scan",
        "x-octm-order": 10
      },
      "recursive": {
        "type": "boolean",
        "title": "Recursive",
        "description": "Use only sources that can enumerate below found subdomains (subfinder -recursive).",
        "x-octm-flag": "-recursive",
        "x-octm-scope": "scan",
        "x-octm-order": 20
      },
      "max_results": {
        "type": "integer",
        "minimum": 1,
        "maximum": 5000,
        "title": "Maximum names",
        "description": "Keep at most this many names per root domain; the rest are not reported.",
        "x-octm-scope": "scan",
        "x-octm-order": 30
      },
      "rate_limit": {
        "type": "integer",
        "minimum": 1,
        "maximum": 1000,
        "title": "Rate limit",
        "description": "Most requests per second to the sources (subfinder -rate-limit). Default: no limit beyond the sensor's.",
        "x-octm-common": "rate",
        "x-octm-flag": "-rl",
        "x-octm-scope": "scan",
        "x-octm-group": "Performance",
        "x-octm-order": 110
      },
      "timeout": {
        "type": "integer",
        "minimum": 1,
        "maximum": 300,
        "default": 30,
        "title": "Source timeout",
        "description": "Seconds to wait for one source (subfinder -timeout).",
        "x-octm-common": "timeout",
        "x-octm-flag": "-timeout",
        "x-octm-scope": "scan",
        "x-octm-group": "Performance",
        "x-octm-order": 130
      }
    }
  }
permissions:
  network: egress-proxy
  proxy: honors
  # The keys of the passive sources that need one, by subfinder source name.
  # Delivered per task (the organization's keys from the platform, else the
  # operator's), written to the task's provider configuration, never argv.
  credentials:
  - {name: alienvault, kind: api_key, description: "AlienVault OTX key"}
  - {name: bevigil, kind: api_key, description: "BeVigil key"}
  - {name: bufferover, kind: api_key, description: "BufferOver key"}
  - {name: builtwith, kind: api_key, description: "BuiltWith key"}
  - {name: c99, kind: api_key, description: "C99 key"}
  - {name: censys, kind: api_key, description: "Censys key, written as TOKEN:ORG_ID"}
  - {name: certspotter, kind: api_key, description: "Cert Spotter key"}
  - {name: chaos, kind: api_key, description: "Chaos key"}
  - {name: chinaz, kind: api_key, description: "Chinaz key"}
  - {name: digitalyama, kind: api_key, description: "DigitalYama key"}
  - {name: dnsdb, kind: api_key, description: "DNSDB key"}
  - {name: dnsdumpster, kind: api_key, description: "DNSDumpster key"}
  - {name: dnsrepo, kind: api_key, description: "DNSRepo key"}
  - {name: domainsproject, kind: api_key, description: "Domains Project key, written as USERNAME:PASSWORD"}
  - {name: driftnet, kind: api_key, description: "Driftnet key"}
  - {name: facebook, kind: api_key, description: "Facebook CT key, written as APP_ID:APP_SECRET"}
  - {name: fofa, kind: api_key, description: "FOFA key, written as EMAIL:KEY"}
  - {name: fullhunt, kind: api_key, description: "FullHunt key"}
  - {name: github, kind: api_key, description: "GitHub key"}
  - {name: gitlab, kind: api_key, description: "GitLab key"}
  - {name: hackertarget, kind: api_key, description: "HackerTarget key"}
  - {name: intelx, kind: api_key, description: "Intelligence X key, written as HOST:KEY"}
  - {name: leakix, kind: api_key, description: "LeakIX key"}
  - {name: merklemap, kind: api_key, description: "MerkleMap key"}
  - {name: netlas, kind: api_key, description: "Netlas key"}
  - {name: onyphe, kind: api_key, description: "Onyphe key"}
  - {name: profundis, kind: api_key, description: "Profundis key"}
  - {name: pugrecon, kind: api_key, description: "PugRecon key"}
  - {name: quake, kind: api_key, description: "Quake key"}
  - {name: reconeer, kind: api_key, description: "Reconeer key"}
  - {name: redhuntlabs, kind: api_key, description: "RedHunt Labs key"}
  - {name: robtex, kind: api_key, description: "Robtex key"}
  - {name: rsecloud, kind: api_key, description: "RSECloud key"}
  - {name: securitytrails, kind: api_key, description: "SecurityTrails key"}
  - {name: shodan, kind: api_key, description: "Shodan key"}
  - {name: threatbook, kind: api_key, description: "ThreatBook key"}
  - {name: urlscan, kind: api_key, description: "urlscan.io key"}
  - {name: virustotal, kind: api_key, description: "VirusTotal key"}
  - {name: whoisxmlapi, kind: api_key, description: "WhoisXML API key"}
  - {name: windvane, kind: api_key, description: "Windvane key"}
  - {name: zoomeyeapi, kind: api_key, description: "ZoomEye key"}
resources:
  profile: light
  timeout: 24h0m0s
  max_output_bytes: 268435456
  max_records: 1000000
safety:
  expands_targets: true
