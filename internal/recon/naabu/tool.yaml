# Tool descriptor of naabu (OpenCTEM Tool Contract v1), embedded in the sensor.
# The single source of this tool's contract: the sensor loads it at start,
# reports it to the platform by digest and enforces it on every task.
apiVersion: openctem.io/tool/v1
name: naabu
version: 2.0.0
description: TCP connect port scan of the target's hosts (ProjectDiscovery naabu); no raw sockets, no capabilities.
publisher: openctemio
engine:
  name: naabu
  license: MIT
presentation:
  display_name: Naabu
  category: network
  icon: radar
class: target-scan
tier: T1
implements:
- capability: scan.ports@1
  output_shape: ip_ports
  params:
    ports:
      key: ports
    top_n:
      key: top_ports
    rate:
      key: rate
consumes: [domain, subdomain, ip_address, host]
produces: ['asset:ip_address', 'asset:host']
input:
  batch: list
# The configuration schema scans are validated against (JSON in YAML).
config:
  {
    "$schema": "https://json-schema.org/draft/2020-12/schema",
    "x-octm-schema-version": 1,
    "title": "naabu",
    "type": "object",
    "additionalProperties": false,
    "properties": {
      "ports": {
        "type": "string",
        "minLength": 1,
        "maxLength": 2048,
        "pattern": "^(?:top-100|top-1000|full|[0-9]{1,5}(?:-[0-9]{1,5})?(?:,[0-9]{1,5}(?:-[0-9]{1,5})?)*)$",
        "title": "Ports",
        "description": "Ports to scan: a list such as 80,443,8000-8100, or top-100, top-1000 or full (naabu -p / -top-ports). Default: the top 100 ports.",
        "x-octm-scope": "scan",
        "x-octm-group": "Ports",
        "x-octm-order": 10
      },
      "top_ports": {
        "type": "integer",
        "enum": [
          100,
          1000
        ],
        "title": "Top ports",
        "description": "Scan the N most common ports instead of a list (naabu -top-ports). Not together with ports.",
        "x-octm-scope": "scan",
        "x-octm-group": "Ports",
        "x-octm-order": 20
      },
      "exclude_ports": {
        "type": "string",
        "minLength": 1,
        "maxLength": 2048,
        "pattern": "^[0-9]{1,5}(?:-[0-9]{1,5})?(?:,[0-9]{1,5}(?:-[0-9]{1,5})?)*$",
        "title": "Excluded ports",
        "description": "Ports never scanned, e.g. 25,465 (naabu -exclude-ports).",
        "x-octm-scope": "scan",
        "x-octm-group": "Ports",
        "x-octm-order": 30
      },
      "rate": {
        "type": "integer",
        "minimum": 1,
        "maximum": 100000,
        "title": "Packets per second",
        "description": "Run slower than the sensor's own rate (naabu -rate). A scan can only lower it: a value above the sensor's rate runs at the sensor's rate.",
        "x-octm-scope": "scan",
        "x-octm-group": "Performance",
        "x-octm-order": 40
      },
      "retries": {
        "type": "integer",
        "minimum": 0,
        "maximum": 10,
        "title": "Retries",
        "description": "Probes per port before it counts as closed (naabu -retries).",
        "x-octm-scope": "scan",
        "x-octm-group": "Performance",
        "x-octm-order": 50
      }
    }
  }
permissions:
  network: targets
resources:
  timeout: 24h0m0s
  max_output_bytes: 268435456
  max_records: 1000000
safety:
  rate_param: rate
