# Tool descriptor of semgrep (OpenCTEM Tool Contract v1), embedded in the sensor.
# The single source of this tool's contract: the sensor loads it at start,
# reports it to the platform by digest and enforces it on every task.
apiVersion: openctem.io/tool/v1
name: semgrep
version: 2.0.0
description: Static analysis of a source tree with semgrep rules (registry rules or the platform's custom rules).
publisher: openctemio
engine:
  name: semgrep
  license: LGPL-2.1-only
presentation:
  display_name: Semgrep
  category: code
  icon: code
class: target-scan
tier: T0
implements:
- capability: sast.code@1
consumes: [repository]
produces: ['asset:repository', 'finding:vulnerability']
permissions:
  network: egress-proxy
  filesystem: scan-roots-read-only
  proxy: honors
resources:
  timeout: 6h0m0s
