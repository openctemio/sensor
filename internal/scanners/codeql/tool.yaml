# Tool descriptor of codeql (OpenCTEM Tool Contract v1), embedded in the sensor.
# The single source of this tool's contract: the sensor loads it at start,
# reports it to the platform by digest and enforces it on every task.
apiVersion: openctem.io/tool/v1
name: codeql
version: 2.0.0
description: Semantic code analysis of a source tree with CodeQL query packs (database built per scan).
publisher: openctemio
engine:
  name: codeql
presentation:
  display_name: CodeQL
  category: code
  icon: code
class: target-scan
tier: T0
implements:
- capability: sast.code@1
  params:
    languages: {key: languages}
consumes: [repository]
produces: ['asset:repository', 'finding:vulnerability']
# The configuration schema scans are validated against (JSON in YAML).
config:
  {
    "$schema": "https://json-schema.org/draft/2020-12/schema",
    "x-octm-schema-version": 1,
    "title": "codeql",
    "type": "object",
    "additionalProperties": false,
    "properties": {
      "languages": {
        "type": "array",
        "minItems": 1,
        "maxItems": 1,
        "items": {
          "enum": [
            "go",
            "java",
            "javascript",
            "python",
            "cpp",
            "csharp",
            "ruby",
            "swift"
          ]
        },
        "title": "Language",
        "description": "The language to analyze (codeql database create --language). CodeQL builds one database per language: exactly one.",
        "x-octm-scope": "scan",
        "x-octm-order": 10
      }
    }
  }
permissions:
  network: egress-proxy
  filesystem: scan-roots-read-only
  proxy: honors
resources:
  timeout: 6h0m0s
