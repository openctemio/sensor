# Tool descriptor of trivy (OpenCTEM Tool Contract v1), embedded in the sensor.
# The single source of this tool's contract: the sensor loads it at start,
# reports it to the platform by digest and enforces it on every task.
apiVersion: openctem.io/tool/v1
name: trivy
version: 2.1.0
description: Vulnerability, misconfiguration, secret and SBOM scanner for source trees, IaC and container images (Aqua Security trivy).
publisher: openctemio
engine:
  name: trivy
  license: Apache-2.0
presentation:
  display_name: Trivy
  category: dependencies
  icon: package
class: target-scan
tier: T0
implements:
- capability: sca.deps@1
  params:
    dev_deps: {key: dev_deps}
- capability: container.image@1
  params:
    os_pkgs: {key: os_pkgs}
- capability: iac.misconfig@1
  params:
    frameworks: {key: frameworks}
- capability: sbom.generate@1
  params:
    dev_deps: {key: dev_deps}
consumes: [repository, container]
produces: ['asset:repository', 'asset:container', 'finding:vulnerability', 'finding:misconfiguration', 'finding:secret', dependency]
# The configuration schema scans are validated against (JSON in YAML).
config:
  {
    "$schema": "https://json-schema.org/draft/2020-12/schema",
    "x-octm-schema-version": 1,
    "title": "trivy",
    "type": "object",
    "additionalProperties": false,
    "properties": {
      "dev_deps": {
        "type": "boolean",
        "title": "Development dependencies",
        "description": "Include development dependencies (trivy --include-dev-deps; npm, yarn and gradle only).",
        "x-octm-scope": "scan",
        "x-octm-order": 10
      },
      "os_pkgs": {
        "type": "boolean",
        "title": "Operating-system packages",
        "description": "Report operating-system packages besides libraries (trivy --pkg-types os,library). Default: both.",
        "x-octm-scope": "scan",
        "x-octm-order": 20
      },
      "frameworks": {
        "type": "array",
        "minItems": 1,
        "maxItems": 8,
        "uniqueItems": true,
        "items": {
          "enum": [
            "azure-arm",
            "cloudformation",
            "dockerfile",
            "helm",
            "kubernetes",
            "terraform",
            "terraformplan-json",
            "terraformplan-snapshot"
          ]
        },
        "title": "IaC frameworks",
        "description": "Only these misconfiguration scanners (trivy --misconfig-scanners).",
        "x-octm-scope": "scan",
        "x-octm-order": 30
      }
    }
  }
permissions:
  network: egress-proxy
  filesystem: scan-roots-read-only
  proxy: honors
resources:
  timeout: 6h0m0s
