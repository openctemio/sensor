# Tool descriptor of nuclei (OpenCTEM Tool Contract v1), embedded in the sensor.
# The single source of this tool's contract: the sensor loads it at start,
# reports it to the platform by digest and enforces it on every task.
apiVersion: openctem.io/tool/v1
name: nuclei
version: 2.1.0
description: Template-based vulnerability and misconfiguration scanner (ProjectDiscovery nuclei), non-intrusive tier by default.
publisher: openctemio
engine:
  name: nuclei
  license: MIT
presentation:
  display_name: Nuclei
  category: vulnerability
  icon: bug
class: target-scan
tier: T1
implements:
- capability: vuln.templates@1
  params:
    severity:
      key: severity
    tags:
      key: tags
    exclude_tags:
      key: exclude_tags
consumes: [domain_name, ip_address, host, web_origin, web_application, api, service]
produces: ['asset:domain_name', 'asset:ip_address', 'asset:service', 'asset:web_origin', 'finding:vulnerability', 'finding:misconfiguration']
input:
  batch: list
# The configuration schema scans are validated against (JSON in YAML).
config:
  {
    "$schema": "https://json-schema.org/draft/2020-12/schema",
    "x-octm-schema-version": 1,
    "title": "nuclei",
    "type": "object",
    "additionalProperties": false,
    "properties": {
      "tags": {
        "type": "array",
        "maxItems": 64,
        "uniqueItems": true,
        "items": {
          "type": "string",
          "pattern": "^[a-z0-9][a-z0-9_-]{0,63}$"
        },
        "title": "Template tags",
        "description": "Run only templates with one of these tags, e.g. cve, exposure (nuclei -tags). Intrusive tags (default-login, brute force, fuzz, dos, intrusive) are refused.",
        "x-octm-scope": "scan",
        "x-octm-group": "Templates",
        "x-octm-order": 10,
        "x-octm-widget": "tags"
      },
      "exclude_tags": {
        "type": "array",
        "maxItems": 64,
        "uniqueItems": true,
        "items": {
          "type": "string",
          "pattern": "^[a-z0-9][a-z0-9_-]{0,63}$"
        },
        "title": "Excluded template tags",
        "description": "Never run templates with these tags (nuclei -etags), in addition to the sensor's own exclusions.",
        "x-octm-scope": "scan",
        "x-octm-group": "Templates",
        "x-octm-order": 20,
        "x-octm-widget": "tags"
      },
      "severity": {
        "type": "array",
        "minItems": 1,
        "maxItems": 6,
        "uniqueItems": true,
        "items": {
          "enum": [
            "info",
            "low",
            "medium",
            "high",
            "critical",
            "unknown"
          ]
        },
        "title": "Severities",
        "description": "Run only templates of these severities (nuclei -severity). Default: every severity, info included (the platform files info matches as exposures, not findings).",
        "x-octm-scope": "scan",
        "x-octm-group": "Templates",
        "x-octm-order": 30
      },
      "scan_strategy": {
        "type": "string",
        "enum": [
          "auto",
          "host-spray",
          "template-spray"
        ],
        "default": "auto",
        "title": "Scan strategy",
        "description": "How nuclei walks hosts and templates (nuclei -ss): host-spray finishes one host before the next (many hosts, few templates), template-spray runs one template across all hosts before the next.",
        "x-octm-scope": "scan",
        "x-octm-flag": "-ss",
        "x-octm-group": "Templates",
        "x-octm-order": 40
      },
      "rate_limit": {
        "type": "integer",
        "minimum": 1,
        "maximum": 5000,
        "default": 150,
        "title": "Rate limit",
        "description": "Most requests per second across all targets (nuclei -rate-limit). Only the sensor's settings may raise it above the default; a scan or a job may lower it.",
        "x-octm-common": "rate",
        "x-octm-flag": "-rate-limit",
        "x-octm-scope": "scan",
        "x-octm-tier": "T1",
        "x-octm-group": "Performance",
        "x-octm-order": 10
      },
      "concurrency": {
        "type": "integer",
        "minimum": 1,
        "maximum": 200,
        "default": 25,
        "title": "Template concurrency",
        "description": "Templates run in parallel (nuclei -c).",
        "x-octm-common": "concurrency",
        "x-octm-flag": "-c",
        "x-octm-scope": "scan",
        "x-octm-group": "Performance",
        "x-octm-order": 20
      },
      "bulk_size": {
        "type": "integer",
        "minimum": 1,
        "maximum": 200,
        "default": 25,
        "title": "Hosts per template",
        "description": "Hosts scanned in parallel for each template (nuclei -bulk-size).",
        "x-octm-flag": "-bs",
        "x-octm-scope": "sensor",
        "x-octm-group": "Performance",
        "x-octm-order": 30
      },
      "timeout": {
        "type": "integer",
        "minimum": 1,
        "maximum": 60,
        "default": 10,
        "title": "Request timeout",
        "description": "Seconds to wait for one request (nuclei -timeout). A job's per-target budget may shorten it.",
        "x-octm-common": "timeout",
        "x-octm-flag": "-timeout",
        "x-octm-scope": "scan",
        "x-octm-group": "Performance",
        "x-octm-order": 40
      },
      "retries": {
        "type": "integer",
        "minimum": 0,
        "maximum": 5,
        "default": 1,
        "title": "Retries",
        "description": "Times a failed request is retried (nuclei -retries).",
        "x-octm-common": "retries",
        "x-octm-flag": "-retries",
        "x-octm-scope": "scan",
        "x-octm-group": "Performance",
        "x-octm-order": 50
      },
      "max_host_errors": {
        "type": "integer",
        "minimum": 1,
        "maximum": 1000,
        "default": 30,
        "title": "Errors before a host is skipped",
        "description": "Errors after which nuclei stops scanning a host (nuclei -max-host-error); the host is reported as not fully covered.",
        "x-octm-flag": "-mhe",
        "x-octm-scope": "scan",
        "x-octm-group": "Performance",
        "x-octm-order": 60
      },
      "response_read_kb": {
        "type": "integer",
        "minimum": 64,
        "maximum": 65536,
        "default": 10240,
        "title": "Response read limit (KiB)",
        "description": "Most of each response nuclei reads and matches on (nuclei -response-size-read); bounds the scan's memory. Matches past the limit are missed. Default 10 MiB.",
        "x-octm-flag": "-rsr",
        "x-octm-scope": "sensor",
        "x-octm-group": "Performance",
        "x-octm-order": 70
      },
      "response_save_kb": {
        "type": "integer",
        "minimum": 16,
        "maximum": 1024,
        "default": 1024,
        "title": "Evidence response limit (KiB)",
        "description": "Most of a matching response kept as the finding's evidence (nuclei -response-size-save), never more than the read limit. Default 1 MiB.",
        "x-octm-flag": "-rss",
        "x-octm-scope": "scan",
        "x-octm-group": "Evidence",
        "x-octm-order": 10
      }
    }
  }
# The job's web scope is enforced by the task's forwarder: nuclei takes a
# web-scoped job only when its network is confined to it (webscope.go).
features:
  web_scope: true
  http_identity: true
permissions:
  network: targets
resources:
  profile: heavy
  timeout: 24h0m0s
  max_output_bytes: 536870912
  max_records: 1000000
