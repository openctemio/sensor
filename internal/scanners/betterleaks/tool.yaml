# Tool descriptor of betterleaks (OpenCTEM Tool Contract v1), embedded in the sensor.
# The single source of this tool's contract: the sensor loads it at start,
# reports it to the platform by digest and enforces it on every task.
apiVersion: openctem.io/tool/v1
name: betterleaks
version: 2.0.0
description: Secret detection in a source tree (betterleaks v1, gitleaks-compatible rules).
publisher: openctemio
engine:
  name: betterleaks
  license: MIT
presentation:
  display_name: Betterleaks
  category: secrets
  icon: key
class: target-scan
tier: T0
implements:
- capability: secrets.code@1
  params:
    history: {key: history}
consumes: [repository]
produces: ['asset:repository', 'finding:secret']
# The configuration schema scans are validated against (JSON in YAML).
config:
  {
    "$schema": "https://json-schema.org/draft/2020-12/schema",
    "x-octm-schema-version": 1,
    "title": "betterleaks",
    "type": "object",
    "additionalProperties": false,
    "properties": {
      "history": {
        "type": "boolean",
        "title": "Commit history",
        "description": "Scan the git history of the repository (betterleaks git), not only the current tree (betterleaks dir). Needs the .git directory in the scan root.",
        "x-octm-scope": "scan",
        "x-octm-order": 10
      }
    }
  }
permissions:
  network: none
  filesystem: scan-roots-read-only
resources:
  timeout: 3h0m0s
